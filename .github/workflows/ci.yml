name: Build Typst Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR builds are pointless; never cancel main or tag builds.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15.1"

      - name: Cache Typst packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/typst/packages
          key: typst-packages-${{ hashFiles('**/*.typ') }}
          restore-keys: typst-packages-

      # Every `main.typ` in the repo is compiled automatically; the PDF is named after its parent folder (e.g. knowledge-sessions/shell/main.typ -> shell.pdf).
      - name: Compile presentations
        run: |
          mkdir -p dist
          mapfile -t sources < <(git ls-files '**/main.typ' 'main.typ')
          if [ ${#sources[@]} -eq 0 ]; then
            echo "::error::No main.typ files found"
            exit 1
          fi

          for src in "${sources[@]}"; do
            name="$(basename "$(dirname "$src")")"
            out="dist/$name.pdf"
            if [ -e "$out" ]; then
              echo "::error file=$src::Two presentations would both produce $name.pdf; rename a folder"
              exit 1
            fi
            echo "::group::$src -> $out"
            typst compile --root . "$src" "$out"
            echo "::endgroup::"
          done

      - name: Upload PDFs as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: typst-pdfs
          path: dist/*.pdf
          if-no-files-found: error
          retention-days: 30

      # Rolling release: every build of main replaces the PDFs on the `latest`
      # release, so .../releases/download/latest/<name>.pdf always serves the
      # current version of each talk.
      - name: Update rolling "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built automatically from ${GITHUB_SHA::7} on main. Replaced on every push."
          if gh release view latest >/dev/null 2>&1; then
            git push --force origin "HEAD:refs/tags/latest"
            gh release upload latest dist/*.pdf --clobber
            gh release edit latest --notes "$notes" --latest
            # Drop PDFs of talks that no longer exist (after uploading, so
            # current links never 404).
            gh release view latest --json assets -q '.assets[].name' | while read -r asset; do
              [ -e "dist/$asset" ] || gh release delete-asset latest "$asset" --yes
            done
          else
            gh release create latest dist/*.pdf --target "$GITHUB_SHA" \
              --title "Latest" --notes "$notes" --latest
          fi

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # Keep the rolling `latest` release at the top of the releases page.
          make_latest: false
          files: dist/*.pdf